# \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC815\uBCF4
spring.application.name=demo

# Server (Railway: PORT is injected by the platform)
server.address=0.0.0.0
server.port=${PORT:8080}

# JWT signing secret (Railway variable JWT_SECRET, 32+ bytes)
jwt.secret=${JWT_SECRET:}

# =========================
# MySQL (Railway) - values come from environment variables
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# HikariCP \uC124\uC815 (\uCEE4\uB125\uC158 \uD480 \uCD5C\uC801\uD654)
# =========================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# =========================
# JPA \uC124\uC815
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =========================
# Actuator (\uBAA8\uB2C8\uD130\uB9C1)
# =========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =========================
# \uC5C5\uB85C\uB4DC \uBC0F AI API \uC124\uC815
# =========================
# \uC548\uB4DC\uB85C\uC774\uB4DC\uC5D0\uC11C \uBC1B\uC740 \uC774\uBBF8\uC9C0\uB97C \uC7A0\uC2DC \uC800\uC7A5\uD560 \uD3F4\uB354 (\uD544\uC694\uC2DC \uC720\uC9C0)
app.upload-dir=uploads

# \u2705 \uD575\uC2EC: \uC624\uC9C1 \uC774 URL\uB9CC \uC0AC\uC6A9\uD569\uB2C8\uB2E4.
ai.api.url=${AI_API_URL:http://localhost:5000/recycle/analyze}

# =========================
# \uB85C\uAE45 (\uC6B4\uC601 \uB2E8\uACC4\uC5D0\uC11C\uB294 INFO \uAD8C\uC7A5)
# =========================
logging.level.org.springframework.web=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=DEBUG